name: Build and Release SilverBulletPro

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to create a GitHub Release (e.g., v1.0.0). Leave empty for CI build only."
        required: false
        default: ""

permissions:
  contents: write

env:
  SOLUTION_PATH: SilverBulletPro.sln
  PROJECT_PATH: SilverBulletPro/SilverBulletPro.csproj
  APP_NAME: SilverBulletPro
  BUILD_CONFIG: Release

jobs:
  build-and-release:
    name: Build WPF App (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate solution and project files
        id: locate
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Filter "SilverBulletPro.sln" -Recurse -Depth 2 | Select-Object -First 1
          $csproj = Get-ChildItem -Filter "SilverBulletPro.csproj" -Recurse -Depth 3 | Select-Object -First 1

          if (-not $csproj) {
            Write-Error "SilverBulletPro.csproj not found in repository."
            exit 1
          }

          $isSdkStyle = (Select-String -Path $csproj.FullName -Pattern '<Project\s+Sdk=' -Quiet)
          Write-Host "Found project: $($csproj.FullName)"
          Write-Host "SDK-Style Project: $isSdkStyle"

          "sln_path=$($sln.FullName)" >> $env:GITHUB_OUTPUT
          "csproj_path=$($csproj.FullName)" >> $env:GITHUB_OUTPUT
          "is_sdk_style=$isSdkStyle" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Setup NuGet (for legacy .NET Framework projects)
        if: steps.locate.outputs.is_sdk_style == 'False'
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild (for legacy .NET Framework projects)
        if: steps.locate.outputs.is_sdk_style == 'False'
        uses: microsoft/setup-msbuild@v2

      - name: Restore and Build (SDK-Style .NET)
        if: steps.locate.outputs.is_sdk_style == 'True'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "publish_out"
          dotnet restore "${{ steps.locate.outputs.csproj_path }}"
          dotnet publish "${{ steps.locate.outputs.csproj_path }}" `
            -c ${{ env.BUILD_CONFIG }} `
            -o "$outDir" `
            --no-restore

      - name: Restore and Build (Legacy .NET Framework MSBuild)
        if: steps.locate.outputs.is_sdk_style == 'False'
        shell: pwsh
        run: |
          $slnPath = "${{ steps.locate.outputs.sln_path }}"
          $csprojPath = "${{ steps.locate.outputs.csproj_path }}"
          $outDir = "$($env:GITHUB_WORKSPACE -replace '\\','/')/publish_out/"

          if ($slnPath -and (Test-Path $slnPath)) {
            nuget restore "$slnPath"
          } else {
            nuget restore "$csprojPath"
          }

          msbuild "$csprojPath" `
            /t:Build `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:OutDir="$outDir" `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /m

      - name: Package Release ZIP and Checksum
        id: package
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish_out"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          if (-not (Test-Path $publishDir) -or ((Get-ChildItem $publishDir).Count -eq 0)) {
            Write-Error "Build output directory is empty."
            exit 1
          }

          # Determine version label
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $version = "${{ inputs.release_tag }}"
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $version = "dev-$shortSha"
          }

          $zipName = "${{ env.APP_NAME }}-$version-win.zip"
          $zipPath = Join-Path $distDir $zipName

          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath (Join-Path $distDir "SHA256SUMS.txt") -Encoding ascii

          Write-Host "Packaged: $zipPath"
          Write-Host "SHA256: $hash"

          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.package.outputs.version }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: "${{ env.APP_NAME }} ${{ steps.package.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.package.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
