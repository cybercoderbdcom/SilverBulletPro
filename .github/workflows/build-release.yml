name: Build and Release SilverBulletPro

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name to create a GitHub Release manually (e.g., v1.1.4)'
        required: false
        type: string
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SOLUTION_FILE: 'SilverBulletPro.sln'
  PROJECT_FILE: 'SilverBulletPro/SilverBulletPro.csproj'
  BUILD_CONFIGURATION: 'Release'
  BUILD_PLATFORM: 'Any CPU'
  APP_NAME: 'SilverBulletPro'

jobs:
  build-and-release:
    name: MSBuild WPF & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet CLI (Latest)
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Clean VS Cache & Patch MSBuild TargetFramework Properties
        id: patch
        shell: pwsh
        run: |
          # 1. Remove committed .vs directories
          Get-ChildItem -Path . -Include ".vs" -Recurse -Recurse -Directory -Force |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "${{ env.PROJECT_FILE }}")) {
            Write-Error "Project file not found at ${{ env.PROJECT_FILE }}"
            exit 1
          }

          [xml]$xml = Get-Content "${{ env.PROJECT_FILE }}"
          $pg = $xml.Project.PropertyGroup | Select-Object -First 1

          # 2. Extract numeric TargetFrameworkVersion (strip leading 'v' or 'V')
          $rawTfv = ($xml.Project.PropertyGroup.TargetFrameworkVersion | Where-Object { $_ } | Select-Object -First 1)
          $tfi = ($xml.Project.PropertyGroup.TargetFrameworkIdentifier | Where-Object { $_ } | Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($rawTfv)) {
            $rawTfv = "v4.8"
          }
          $cleanTfv = $rawTfv.Trim().TrimStart('v', 'V')
          if ($cleanTfv -notmatch '^\d+\.\d+') {
            $cleanTfv = "4.8"
          }

          Write-Host "Detected TargetFrameworkIdentifier: '$tfi'"
          Write-Host "Detected TargetFrameworkVersion: '$rawTfv' -> Numeric: '$cleanTfv'"

          # 3. Patch SilverBulletPro.csproj raw content so MSBuild 18 evaluates numeric versions
          $csprojText = Get-Content "${{ env.PROJECT_FILE }}" -Raw
          $csprojText = $csprojText -replace '<LangVersion>[^<]+</LangVersion>', '<LangVersion>12.0</LangVersion>'

          if ($csprojText -notmatch '<_TargetFrameworkVersionWithoutV>') {
            $injection = "<TargetFrameworkVersion>v$cleanTfv</TargetFrameworkVersion>`r`n    <_TargetFrameworkVersionWithoutV>$cleanTfv</_TargetFrameworkVersionWithoutV>"
            if ($csprojText -match '<TargetFrameworkVersion>[^<]*</TargetFrameworkVersion>') {
              $csprojText = [regex]::Replace($csprojText, '<TargetFrameworkVersion>[^<]*</TargetFrameworkVersion>', $injection, 1)
            } else {
              $csprojText = [regex]::Replace($csprojText, '<PropertyGroup>', "<PropertyGroup>`r`n    $injection", 1)
            }
          }

          Set-Content -Path "${{ env.PROJECT_FILE }}" -Value $csprojText -Encoding UTF8
          "tfv_num=$cleanTfv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Dependencies
        shell: pwsh
        run: |
          $pkgConfigs = Get-ChildItem -Path . -Filter "packages.config" -Recurse
          foreach ($cfg in $pkgConfigs) {
            nuget restore $cfg.FullName -PackagesDirectory "packages" -NonInteractive
          }

          msbuild "${{ env.PROJECT_FILE }}" `
            /t:Restore `
            /p:RestorePackagesConfig=true `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="AnyCPU" `
            /p:_TargetFrameworkVersionWithoutV="${{ steps.patch.outputs.tfv_num }}" `
            /p:LangVersion=12.0 `
            /v:minimal

      - name: Determine Version Number
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.release_tag }}" -ne "") {
            $rawTag = "${{ github.event.inputs.release_tag }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $rawTag = "${{ github.ref_name }}"
          } else {
            $rawTag = "v1.0.0-ci.${{ github.run_number }}"
          }
          "tag=$rawTag" \vert{} Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved Tag: $rawTag"

      - name: Build Solution with MSBuild
        shell: pwsh
        run: |
          msbuild "${{ env.SOLUTION_FILE }}" `
            /t:Build `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ env.BUILD_PLATFORM }}" `
            /p:_TargetFrameworkVersionWithoutV="${{ steps.patch.outputs.tfv_num }}" `
            /p:LangVersion=12.0 `
            /p:DebugSymbols=false `
            /p:DebugType=None `
            /p:AllowedReferenceRelatedFileExtensions=none `
            /m `
            /v:minimal

      - name: Locate Build Output & Package Release Archive
        id: package
        shell: pwsh
        run: |
          $binDir = Get-ChildItem -Path "SilverBulletPro/bin" -Recurse -Filter "SilverBulletPro.exe" |
                    Select-Object -First 1 -ExpandProperty DirectoryName

          if (-not $binDir) {
            Write-Error "Could not locate compiled SilverBulletPro.exe under SilverBulletPro/bin"
            exit 1
          }

          Write-Host "Packaging binaries from: $binDir"
          $stagingDir = Join-Path$env:RUNNER_TEMP "staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item -Path "$binDir\*" -Destination $stagingDir -Recurse -Force -Exclude "*.pdb", "*.xml"

          $zipName = "${{ env.APP_NAME }}-${{ steps.version.outputs.tag }}-win.zip"
          $zipPath = Join-Path $PWD$zipName
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Path$zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash$zipName" | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8

          "zip_name=$zipName" \vert{} Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" \vert{} Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Build Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.package.outputs.zip_name }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ env.APP_NAME }}${{ steps.version.outputs.tag }}"
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ### 📦 ${{ env.APP_NAME }}${{ steps.version.outputs.tag }} Release
            
            #### 🔒 SHA-256 Checksum
            ```text
            ${{ steps.package.outputs.sha256 }}${{ steps.package.outputs.zip_name }}
            ```
          files: |
            ${{ steps.package.outputs.zip_name }}
            SHA256SUMS.txt
